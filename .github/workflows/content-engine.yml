name: scene-factory
# CONTENT ENGINE (4th system, own repo since 2026-11-13, not posted): the full factory, with no person and no laptop. Runs twice a day at quiet hours (owner OK 2026-11-13).
# Each finished video is saved in its own GitHub release (tag ce-YYYYMMDD-HHMM = the system's video folder, list in data/scenes/videos.json) and shown in the app's Review tab.
# Idea maker thinks of a NEW topic (or a topic is given) -> the writer plans and writes the scene -> checker
# -> scene engine draws it -> narrator, sounds, music -> video on a prerelease. Nothing is posted.
# Start it by pushing publish/run.trigger: first line "auto" (the system picks a new idea) or a topic.
on:
  schedule:
    - cron: '5 4 * * *'     # 10:05 PM Chicago
    - cron: '5 9 * * *'     # 3:05 AM Chicago (quiet: before the channels' morning jobs)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to explain, or "auto" to let the system think of a new one'
        default: 'auto'
  push:
    paths: ['publish/run.trigger']
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: scene-factory
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pillow imageio-ffmpeg edge-tts requests
      - name: Restore accepted stages and narration
        uses: actions/cache/restore@v4
        with:
          path: .ce-cache
          key: ce-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ce-v1-${{ runner.os }}-${{ github.ref_name }}-
      - name: Think of the idea and write the scene (free LLMs + checkers)
        env:
          CE_MAX_SECONDS: '900'   # MORE_TIME: rate-limit waits used up the old 8 min before the scene could be repaired
          CE_MAX_REQUESTS: '36'
          TOPIC_IN: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then echo auto > topic.txt
          elif [ -n "$TOPIC_IN" ]; then printf '%s\n' "$TOPIC_IN" > topic.txt; else head -n 1 publish/run.trigger > topic.txt; fi
          if [ "$(tr -d '[:space:]' < topic.txt | tr 'A-Z' 'a-z')" = "auto" ]; then python3 scene_lib/ideas.py pick topic.txt; fi
          python3 -c "import llm; llm.key_check()" || true
          python3 scene_lib/writer.py --topic-file topic.txt auto-scene.json
      - name: Draw, check and assemble the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
        run: |
          npm init -y > /dev/null
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --silent playwright@1.49.1 @fontsource/noto-color-emoji || PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --silent playwright@1.49.1
          npx playwright install chromium
          set -o pipefail
          python3 scene_lib/build.py auto-scene.json scene-factory.mp4 2>&1 | tee render-log.txt
      - name: Save the video in the Content Engine folder and show it in the Review tab
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          TAG="ce-$(date -u +%Y%m%d-%H%M)"; TITLE=$(python3 -c "import json;print(json.load(open('auto-scene.json')).get('title','Content Engine video'))")
          cp scene-factory.mp4 "$TAG.mp4"
          gh release create "$TAG" "$TAG.mp4" auto-scene.json evidence-report.json metrics.json --title "Content Engine: $TITLE" --notes "Content Engine video (not posted). Automatic structural and sampled visibility checks passed. Scientific accuracy and narration/visual meaning still require human review; not approved to publish." --prerelease
          # PLAYABLE_ON_PHONE: iPhone cannot play GitHub release downloads inline, so a copy goes to the gh-pages branch and the card links it through jsDelivr (free CDN, real video type).
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages && mkdir -p pages/videos && cp "$TAG.mp4" pages/videos/ && (cd pages && git add videos && git -c user.email=41898282+github-actions[bot]@users.noreply.github.com -c user.name=github-actions commit -qm "video $TAG" && git push -q) || echo "pages copy skipped"
          URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/videos/$TAG.mp4"
          python3 - "$TAG" "$TITLE" "$URL" <<'PY'
          import json, sys, datetime
          from pathlib import Path
          p = Path('data/scenes/videos.json')
          try: v = json.loads(p.read_text())
          except Exception: v = []
          v.append({'date': datetime.date.today().isoformat(), 'tag': sys.argv[1], 'title': sys.argv[2], 'video': sys.argv[3]})
          p.write_text(json.dumps(v, indent=1, ensure_ascii=False) + '\n')
          PY
          gh label create scene-review --color 6a55c9 --description "Content Engine video to watch (not posted)" 2>/dev/null || true
          printf 'Content Engine video (4th system, NOT posted).\n\nWatch: %s\n\nSaved in the Content Engine folder: release %s. Tap Done in the app when you have seen it.\n' "$URL" "$TAG" > body.txt
          gh issue create --title "Content Engine: $TITLE" --label scene-review --body-file body.txt
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Content Engine: new video" -H "Click: https://zerenaod-ux.github.io/shelfmade-dashboard/app/#review" -d "$TITLE (not posted) is ready to watch in the app." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
      - name: Remember this angle and retain failed-attempt diagnostics
        if: always()
        run: |
          if [ -f scene-factory.mp4 ]; then python3 scene_lib/ideas.py record auto-scene.json; elif [ -f idea.json ] || [ -f writer-log.txt ]; then python3 scene_lib/ideas.py record auto-scene.json failed; else exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scenes/history.json data/scenes/videos.json data/icons 2>/dev/null || git add data/scenes/history.json
          git diff --cached --quiet || { git commit -qm "scene factory: remember idea"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(); for f in scene-factory.mp4 auto-scene.json auto-plan.json idea.json idea-log.txt writer-log.txt voice-log.txt render-log.txt metrics.json evidence-report.json attempts/plan.json attempts/scene.json; do [ -f "$f" ] && files+=("$f"); done
          echo "attaching: ${files[*]}"
          DIAGNOSTICS="ce-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$DIAGNOSTICS" "${files[@]}" --title "Scene factory diagnostics (not posted)" --notes "Diagnostic evidence for this run; previous releases are preserved." --prerelease
      - name: Save reusable stages even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ce-cache
          key: ce-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve repair evidence and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            attempts/
            *-log.txt
            auto-*.json
            metrics.json
            evidence-report.json
            fr/evidence/
          retention-days: 14
