name: scene-factory
# Tested components own geometry/motion; AI chooses supported topics and writes narration.
# Unsupported topics fail explicitly; three automatic generation slots per day.
# HOW IT TICKS: independent cloud generation, with three daily slots authorized November 17.
# Each finished video is saved in its own GitHub release (tag ce-YYYYMMDD-HHMM = the system's video folder, list in data/scenes/videos.json) and shown in the app's Review tab.
# Idea maker thinks of a NEW topic (or a topic is given) -> the writer plans and writes the scene -> checker
# -> scene engine draws it -> narrator, sounds, music -> video on a prerelease. Nothing is posted.
# Start it by pushing publish/run.trigger: first line "auto" (the system picks a new idea) or a topic.
on:
  schedule:
    - cron: '5 1,9,17 * * *' # Three daily UTC slots; 3:05 AM, 11:05 AM, 7:05 PM Chicago standard time.
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to explain, or "auto" to let the system think of a new one'
        default: 'auto'
      kit_recipe:
        description: 'Test: invent a new object from the parts kit even if hand-built machines are unused'
        type: boolean
        default: false
      automatic_slot:
        description: 'Internal bounded catch-up request'
        type: boolean
        default: false
      retry:
        description: 'Internal: which automatic retry this is (0 = first try)'
        default: '0'
  push:
    paths: ['publish/run.trigger']
permissions:
  actions: write
  contents: write
  issues: write
  models: read
concurrency:
  group: scene-factory
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # tested components use CPU rendering, no generative GPU batch
    env:
      CE_FORCE_RECIPE: ${{ github.event.inputs.kit_recipe }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check scheduled daily output and fresh visual capacity
        id: capacity
        env:
          GH_TOKEN: ${{ github.token }}
          CE_AUTOMATIC_SLOT: ${{ github.event.inputs.automatic_slot }}
        run: python -m studio_lib.factory_slots admit
      - run: pip install --quiet numpy pillow edge-tts faster-whisper kokoro-onnx==0.6.1
        if: steps.capacity.outputs.should_build == 'true'
      - name: Verify runner media tools and font before any generation
        if: steps.capacity.outputs.should_build == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            pip install --quiet static-ffmpeg==3.0
            timeout 180 python - <<'PY'
          import os
          from pathlib import Path
          from static_ffmpeg import run
          ffmpeg,ffprobe=run.get_or_fetch_platform_executables_else_raise()
          folder=Path(os.environ['RUNNER_TEMP'])/'verified-media-tools'
          folder.mkdir(exist_ok=True)
          for name,target in [('ffmpeg',ffmpeg),('ffprobe',ffprobe)]:
              link=folder/name
              if not link.exists():link.symlink_to(target)
          with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(folder)+'\n')
          PY
            export PATH="$RUNNER_TEMP/verified-media-tools:$PATH"
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -c "from studio_lib.render import FONT; assert FONT is not None"
      - name: Restore accepted stages and narration
        if: steps.capacity.outputs.should_build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ce-cache
          key: ce-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ce-v1-${{ runner.os }}-${{ github.ref_name }}-
      - name: Select and reserve a new supported topic before media generation
        if: steps.capacity.outputs.should_build == 'true'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
          CE_SHARED_SERVICES: '1'
          CE_JOB_KIND: short
          CE_AUTOMATIC_SLOT: ${{ github.event.inputs.automatic_slot }}
          CE_MAX_SECONDS: '2400'
          CE_MAX_REQUESTS: '120'
          TOPIC_IN: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then echo auto > topic.txt
          elif [ -n "$TOPIC_IN" ]; then printf '%s\n' "$TOPIC_IN" > topic.txt; else head -n 1 publish/run.trigger > topic.txt; fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$(sed -n '2p' publish/run.trigger)" = "cpu-voice-proof" ]; then export CE_FORCE_CPU_VOICE=1; fi
          python3 -m unittest discover -s tests/topic_guard -v
          python3 -m studio_lib.recovery run --kind daily-short --success-stage planning -- python3 -m studio_lib.production --prepare-only --topic-file topic.txt --out scene-factory.mp4
          python3 -m studio_lib.recovery run --kind daily-short -- python3 -m studio_lib.production --topic-file topic.txt --out scene-factory.mp4
      - name: Verify the tested-component review contract
        if: steps.capacity.outputs.should_build == 'true'
        run: |
          python3 -c "import json;from pathlib import Path;assert Path('scene-factory.mp4').is_file();assert json.load(open('ce-checks.json'))['verdict']=='warn';assert json.load(open('auto-scene.json'))['mode']=='tested-component'"
          echo 'Tested component built; owner review required; no automatic publishing' > render-log.txt
      - name: Save the video in the How It Ticks folder and show it in the Review tab
        if: steps.capacity.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          TAG="ce-$(date -u +%Y%m%d-%H%M)"; TITLE=$(python3 -c "import json;print(json.load(open('auto-scene.json')).get('title','How It Ticks video'))")
          cp scene-factory.mp4 "$TAG.mp4"
          gh release create "$TAG" "$TAG.mp4" auto-scene.json evidence-report.json ce-checks.json --title "How It Ticks: $TITLE" --notes "How It Ticks video (not posted). Automatic structural and sampled visibility checks passed. Scientific accuracy and narration/visual meaning still require human review; not approved to publish." --prerelease
          # PLAYABLE_ON_PHONE: iPhone cannot play GitHub release downloads inline, so a copy goes to the gh-pages branch and the card links it through jsDelivr (free CDN, real video type).
          # Preserve original native media whenever it fits the CDN limit; never silently create a broken URL.
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
          python -m studio_lib.phone_media "$TAG.mp4" "pages/videos/$TAG.mp4"
          (
            cd pages
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git config user.name github-actions
            git add videos
            git commit -qm "video $TAG"
            for attempt in 1 2 3; do
              if git push -q; then exit 0; fi
              git pull --rebase -q
            done
            exit 1
          )
          SHA=$(cd pages && git rev-parse HEAD)
          URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}/videos/$TAG.mp4"
          python3 - "$TAG" "$TITLE" "$URL" <<'PY'
          import json, sys, datetime
          from pathlib import Path
          p = Path('data/scenes/videos.json')
          try: v = json.loads(p.read_text())
          except Exception: v = []
          spec = json.loads(Path('auto-scene.json').read_text())
          v.append({'date': datetime.date.today().isoformat(), 'tag': sys.argv[1], 'title': sys.argv[2], 'video': sys.argv[3], 'topic': spec.get('topic'), 'topic_key': spec.get('topic_key'), 'generation_origin':spec.get('generation_origin'), 'production_evidence':spec.get('production_evidence'), **({'recipe':spec['recipe']} if spec.get('recipe') else {})})
          p.write_text(json.dumps(v, indent=1, ensure_ascii=False) + '\n')
          PY
          python3 -m studio_lib.durable_topics save-records
          # PAGES_READY: the Studio plays the Pages copy; wait until it is live so the card never appears before its video (owner 2026-11-21: card opened before Pages finished deploying).
          for i in $(seq 1 40); do [ "$(curl -s -o /dev/null -w '%{http_code}' "https://zerenaod-ux.github.io/content-engine/videos/$TAG.mp4" -r 0-1)" = 206 ] || [ "$(curl -s -o /dev/null -w '%{http_code}' "https://zerenaod-ux.github.io/content-engine/videos/$TAG.mp4" -r 0-1)" = 200 ] && break; sleep 15; done
          gh label create scene-review--color 6a55c9 --description "How It Ticks video to watch (not posted)" 2>/dev/null || true
          printf 'How It Ticks video (4th system, NOT posted).\n\nWatch: %s\n\nSaved in the How It Ticks folder: release %s. Approve in the app to file it under Saved, or Skip to hold it under Delete. Nothing is posted or deleted.\n' "$URL" "$TAG" > body.txt
          V=$(python3 -c "import json;print(json.load(open('ce-checks.json')).get('verdict','warn'))" 2>/dev/null || echo warn)
          R=$(python3 -c "import json;print('; '.join(json.load(open('ce-checks.json')).get('reasons',[])))" 2>/dev/null || true)
          printf '\nChecks: %s %s\n' "$V" "$R" >> body.txt
          gh label create "checks-$V" --color $([ "$V" = ok ] && echo 22863a || echo d29922) 2>/dev/null || true
          gh issue create --title "How It Ticks: $TITLE" --label scene-review --label "checks-$V" --body-file body.txt
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How It Ticks: new video" -H "Click: https://zerenaod-ux.github.io/shelfmade-dashboard/app/#review" -d "$TITLE (not posted) is ready to watch in the app." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
      - name: Remember this angle and retain failed-attempt diagnostics
        if: always() && steps.capacity.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f scene-factory.mp4 ]; then python3 scene_lib/ideas.py record auto-scene.json; elif [ -f idea.json ] || [ -f writer-log.txt ]; then python3 scene_lib/ideas.py record auto-scene.json failed; else exit 0; fi
          # Plan M (2026-11-22): a run that died because free AI was busy (no video made) must not burn its machine/topic.
          if [ ! -f scene-factory.mp4 ] && grep -qiE 'cooldown|HTTP Error (408|429|50[0-9])|HTTP (429|50[0-9])|rate.?limit|quota|timed? ?out|ServiceUnavailable|narration needs|invalid json|Budget' idea-log.txt writer-log.txt auto-scene.json 2>/dev/null; then
            python3 -m studio_lib.durable_topics release-failed || true
          fi
          python3 -m studio_lib.durable_topics save-records
      - name: Retry automatically with a fresh topic (2026-11-23, owner rule - keep building without waiting)
        if: always() && steps.capacity.outputs.should_build == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TRY: ${{ github.event.inputs.retry }}
        run: |
          n=${TRY:-0}
          if [ ! -f scene-factory.mp4 ] && [ "$n" -lt 6 ]; then
            # free AI limits reset by the minute; a rejected plan or picture just needs another topic/machine
            sleep $((300 + 420*n))
            gh api -X POST repos/${{ github.repository }}/actions/workflows/content-engine.yml/dispatches -f ref=${{ github.ref_name }} -f 'inputs[topic]=auto' -f "inputs[retry]=$((n+1))" || true
            echo "retry $((n+1)) dispatched"
          fi
      - name: Attach to release
        if: always() && steps.capacity.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(); for f in scene-factory.mp4 scene-factory-wordless.mp4 auto-scene.json auto-plan.json idea.json idea-log.txt writer-log.txt voice-log.txt render-log.txt metrics.json evidence-report.json attempts/plan.json attempts/scene.json; do [ -f "$f" ] && files+=("$f"); done
          echo "attaching: ${files[*]}"
          DIAGNOSTICS="ce-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$DIAGNOSTICS" "${files[@]}" --title "Scene factory diagnostics (not posted)" --notes "Diagnostic evidence for this run; previous releases are preserved." --prerelease
      - name: Save reusable stages even after failure
        if: always() && steps.capacity.outputs.should_build == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ce-cache
          key: ce-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve repair evidence and measurements
        if: always() && steps.capacity.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            attempts/
            *-log.txt
            auto-*.json
            metrics.json
            daily-resume-provenance.json
            component-output/production/*.json
            component-output/production/video.mp4
            component-output/production/*.png
            evidence-report.json
            phone-delivery-quality.json
            fr/evidence/
          retention-days: 14
      - name: Confirm Studio delivery in the shared status feed
        if: success() && steps.capacity.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m studio_lib.recovery stage --kind daily-short --stage delivered
