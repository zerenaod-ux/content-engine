name: scene-factory
# Tested components own geometry/motion; AI chooses supported topics and writes narration.
# Unsupported topics fail explicitly. The generation schedule remains paused.
# CONTENT ENGINE (4th system, own repo since 2026-11-13, not posted): the full factory, with no person and no laptop. Runs twice a day at quiet hours (owner OK 2026-11-13).
# Each finished video is saved in its own GitHub release (tag ce-YYYYMMDD-HHMM = the system's video folder, list in data/scenes/videos.json) and shown in the app's Review tab.
# Idea maker thinks of a NEW topic (or a topic is given) -> the writer plans and writes the scene -> checker
# -> scene engine draws it -> narrator, sounds, music -> video on a prerelease. Nothing is posted.
# Start it by pushing publish/run.trigger: first line "auto" (the system picks a new idea) or a topic.
on:
  # schedule:
    # PAUSED 2026-11-14 (owner): card-style videos stopped until the drawn car is ready
    # - cron: '5 4 * * *'     # 10:05 PM Chicago
    # - cron: '5 9 * * *'     # 3:05 AM Chicago (quiet: before the channels' morning jobs)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to explain, or "auto" to let the system think of a new one'
        default: 'auto'
  push:
    paths: ['publish/run.trigger']
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: scene-factory
  cancel-in-progress: false
jobs:
  build:
    if: ${{ false }} # Retired: owner forbids regenerated or similar videos.
    runs-on: ubuntu-latest
    timeout-minutes: 20   # tested components use CPU rendering, no generative GPU batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pillow edge-tts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null   # CPU component rendering and measured narration
      - name: Restore accepted stages and narration
        uses: actions/cache/restore@v4
        with:
          path: .ce-cache
          key: ce-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ce-v1-${{ runner.os }}-${{ github.ref_name }}-
      - name: Select a supported topic and build the tested component
        env:
          CE_MAX_SECONDS: '480'
          CE_MAX_REQUESTS: '12'
          TOPIC_IN: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then echo auto > topic.txt
          elif [ -n "$TOPIC_IN" ]; then printf '%s\n' "$TOPIC_IN" > topic.txt; else head -n 1 publish/run.trigger > topic.txt; fi
          python3 -c "import llm; llm.key_check()" || true
          python3 -m studio_lib.production --topic-file topic.txt --out scene-factory.mp4
      - name: Verify the tested-component review contract
        run: |
          python3 -c "import json;from pathlib import Path;assert Path('scene-factory.mp4').is_file();assert json.load(open('ce-checks.json'))['verdict']=='warn';assert json.load(open('auto-scene.json'))['mode']=='tested-component'"
          echo 'Tested component built; owner review required; no automatic publishing' > render-log.txt
      - name: Save the video in the How It Ticks folder and show it in the Review tab
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          TAG="ce-$(date -u +%Y%m%d-%H%M)"; TITLE=$(python3 -c "import json;print(json.load(open('auto-scene.json')).get('title','How It Ticks video'))")
          cp scene-factory.mp4 "$TAG.mp4"
          gh release create "$TAG" "$TAG.mp4" auto-scene.json evidence-report.json ce-checks.json --title "How It Ticks: $TITLE" --notes "How It Ticks video (not posted). Automatic structural and sampled visibility checks passed. Scientific accuracy and narration/visual meaning still require human review; not approved to publish." --prerelease
          # PLAYABLE_ON_PHONE: iPhone cannot play GitHub release downloads inline, so a copy goes to the gh-pages branch and the card links it through jsDelivr (free CDN, real video type).
          # PHONE_COPY: re-encoded under the 20 MB jsDelivr limit (bigger files do not play); the URL uses the commit id so a cached refusal can never stick.
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages && mkdir -p pages/videos && ffmpeg -v error -y -i "$TAG.mp4" -c:v libx264 -preset veryfast -b:v 1800k -maxrate 2200k -bufsize 4M -c:a aac -b:a 128k -movflags +faststart "pages/videos/$TAG.mp4" && (cd pages && git add videos && git -c user.email=41898282+github-actions[bot]@users.noreply.github.com -c user.name=github-actions commit -qm "video $TAG" && git push -q) || echo "pages copy skipped"
          SHA=$(cd pages && git rev-parse HEAD)
          URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}/videos/$TAG.mp4"
          python3 - "$TAG" "$TITLE" "$URL" <<'PY'
          import json, sys, datetime
          from pathlib import Path
          p = Path('data/scenes/videos.json')
          try: v = json.loads(p.read_text())
          except Exception: v = []
          v.append({'date': datetime.date.today().isoformat(), 'tag': sys.argv[1], 'title': sys.argv[2], 'video': sys.argv[3]})
          p.write_text(json.dumps(v, indent=1, ensure_ascii=False) + '\n')
          PY
          gh label create scene-review --color 6a55c9 --description "How It Ticks video to watch (not posted)" 2>/dev/null || true
          printf 'How It Ticks video (4th system, NOT posted).\n\nWatch: %s\n\nSaved in the How It Ticks folder: release %s. Approve in the app to file it under Saved, or Skip to hold it under Delete. Nothing is posted or deleted.\n' "$URL" "$TAG" > body.txt
          V=$(python3 -c "import json;print(json.load(open('ce-checks.json')).get('verdict','warn'))" 2>/dev/null || echo warn)
          R=$(python3 -c "import json;print('; '.join(json.load(open('ce-checks.json')).get('reasons',[])))" 2>/dev/null || true)
          printf '\nChecks: %s %s\n' "$V" "$R" >> body.txt
          gh label create "checks-$V" --color $([ "$V" = ok ] && echo 22863a || echo d29922) 2>/dev/null || true
          gh issue create --title "How It Ticks: $TITLE" --label scene-review --label "checks-$V" --body-file body.txt
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How It Ticks: new video" -H "Click: https://zerenaod-ux.github.io/shelfmade-dashboard/app/#review" -d "$TITLE (not posted) is ready to watch in the app." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
      - name: Remember this angle and retain failed-attempt diagnostics
        if: always()
        run: |
          if [ -f scene-factory.mp4 ]; then python3 scene_lib/ideas.py record auto-scene.json; elif [ -f idea.json ] || [ -f writer-log.txt ]; then python3 scene_lib/ideas.py record auto-scene.json failed; else exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scenes/history.json data/scenes/videos.json data/scenes/inside-history.json data/icons 2>/dev/null || git add data/scenes/history.json
          git diff --cached --quiet || { git commit -qm "scene factory: remember idea"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(); for f in scene-factory.mp4 auto-scene.json auto-plan.json idea.json idea-log.txt writer-log.txt voice-log.txt render-log.txt metrics.json evidence-report.json attempts/plan.json attempts/scene.json; do [ -f "$f" ] && files+=("$f"); done
          echo "attaching: ${files[*]}"
          DIAGNOSTICS="ce-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$DIAGNOSTICS" "${files[@]}" --title "Scene factory diagnostics (not posted)" --notes "Diagnostic evidence for this run; previous releases are preserved." --prerelease
      - name: Save reusable stages even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ce-cache
          key: ce-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve repair evidence and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            attempts/
            *-log.txt
            auto-*.json
            metrics.json
            evidence-report.json
            fr/evidence/
          retention-days: 14
