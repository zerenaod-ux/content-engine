name: Verify How It Ticks publishing status (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_run:
    workflows: [how-it-ticks-publisher, content-engine-review-folders]
    types: [completed]
  push:
    branches: [main]
    paths: [.github/workflows/ce-publish-verify.yml, publish/verify_status.py]
permissions:
  contents: write
concurrency:
  group: how-it-ticks-publishing-status
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read publishing status without creating any post
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: python publish/verify_status.py
      - name: Share the verified snapshot with Studio on all devices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish/save_status_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publishing-status
          path: publish-status-report.json
          retention-days: 7
