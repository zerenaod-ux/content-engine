name: how-it-ticks-autopilot
run-name: How It Ticks autopilot ${{ github.event.inputs.mode || 'run' }}
on:
  schedule:
    - cron: '50 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'on = approve good videos by itself, off = you approve by hand, run = one pass now'
        required: true
        default: 'off'
        type: choice
        options: ['on', 'off', 'run']
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: ce-autopilot
  cancel-in-progress: false
jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Switch or run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ce_autopilot.py "${{ github.event.inputs.mode || 'run' }}"
      - name: Save state
        if: always()
        run: |
          git config user.name "autopilot-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/ce-autopilot.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "autopilot: state"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
