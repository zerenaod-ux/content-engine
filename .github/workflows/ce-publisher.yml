name: how-it-ticks-publisher
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [content-engine-review-folders]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: ce-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan or publish approved videos (dry-run unless variable PUBLISH_LIVE=1)
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
        run: python ce_publisher.py
      - name: Save publish state
        if: always()
        run: |
          git config user.name "publisher-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/state.json publish/live.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state change"; exit 0; }
          git commit -qm "publisher: state"
          SAVED=0
          for i in 1 2 3 4; do
            if git pull --rebase -q && git push -q; then SAVED=1; break; fi
            sleep 5
          done
          [ "$SAVED" = 1 ] || { echo "Publishing state was not saved; review the existing remote bookings before retrying."; exit 1; }
