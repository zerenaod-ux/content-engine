name: Long compilation of approved shorts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 14 * * 0'
permissions:
  contents: write
  issues: write
concurrency:
  group: ce-compilation
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pillow edge-tts
      - name: Media tools
        run: |
          if ! command -v ffmpeg >/dev/null || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            timeout 180s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          fi
      - run: python -m pytest tests/studio/test_compilation.py -q || pip install --quiet pytest && python -m pytest tests/studio/test_compilation.py -q
      - name: Build and deliver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m studio_lib.compilation_job
