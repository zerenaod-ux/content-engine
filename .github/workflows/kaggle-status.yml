name: kaggle-status
# Shows whether the How It Ticks motion runs on Kaggle are still busy (they use the free weekly GPU hours).
on: workflow_dispatch
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: minddoodles
    steps:
      - run: pip install -q kaggle six python-slugify python-dateutil tqdm bleach protobuf text-unidecode
      - run: |
          for k in content-engine-motion content-engine-motion-b; do echo "== $k"; kaggle kernels status minddoodles/$k || true; mkdir -p o/$k; kaggle kernels output minddoodles/$k -p o/$k >/dev/null 2>&1 || true; tail -c 1500 o/$k/motion.log 2>/dev/null; ls o/$k | head; done
          kaggle kernels --help | grep -iE "cancel|stop|delete" || true
