name: Verify corrected daily short media
on:
  push:
    paths: ['publish/daily-quality.trigger']
permissions:
  contents: write
  models: read
concurrency:
  group: scene-factory
  cancel-in-progress: false
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pillow edge-tts faster-whisper kokoro-onnx==0.6.1
      - name: Verify installed production tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          python -c "from studio_lib.render import FONT; assert FONT is not None"
      - uses: actions/cache/restore@v4
        with:
          path: .ce-cache
          key: ce-quality-${{ github.run_id }}
          restore-keys: |
            ce-v1-Linux-main-
      - name: Repair original system-selected explanation and render
        env:
          GH_TOKEN: ${{ github.token }}
          CE_FORCE_CPU_VOICE: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python -m unittest discover -s tests/studio -q
          python - <<'PY'
          import json
          from pathlib import Path
          from studio_lib.director import run
          rows=json.loads(Path('data/scenes/topic-ledger.json').read_text())
          owned=[row for row in rows if str(row.get('owner'))=='44363993361']
          assert len(owned)==1,'Original automatic reservation must exist'
          run(owned[0]['topic'],Path('corrected-daily'))
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ce-cache
          key: ce-quality-${{ github.run_id }}
      - name: Save exact correction for inspection, without another review card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-daily-media-${{ github.run_id }}
          path: corrected-daily/
          retention-days: 14
