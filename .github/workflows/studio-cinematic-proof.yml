name: Cinematic system comparison (not posted)
on:
  push:
    branches: [studio-cinematic-proof]
    paths: [publish/cinema.trigger]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  models: read
concurrency:
  group: cinematic-comparison
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pillow edge-tts faster-whisper
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq blender xvfb ffmpeg fonts-dejavu-core > /dev/null
      - run: python -m unittest discover -s tests/cinema -v
      - uses: actions/cache/restore@v4
        with:
          path: .ce-cache/cinema-voice
          key: cinema-voice-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cinema-voice-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: |
            cinema-output/plan.json
            cinema-output/topic-brief.json
            cinema-output/narration-critique.json
          key: cinema-plan-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cinema-plan-${{ runner.os }}-${{ github.run_id }}-
      - name: System selects and reserves an uncovered topic from full history
        if: hashFiles('publish/cinema.auto') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CE_SHARED_SERVICES: '1'
          CE_JOB_KIND: short
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CE_MAX_REQUESTS: '8'
          CE_MAX_SECONDS: '240'
        run: python -m studio_lib.recovery run --kind short --success-stage planning -- python -m studio_lib.cinema.auto_topic
      - name: Select matching accepted-stage recovery
        id: resume
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('publish/cinema.resume.json')
          if p.exists():
              r=json.loads(p.read_text())
              if r.get('topic')==Path('publish/cinema.topic').read_text().strip() and type(r.get('run_id')) is int:
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                      f.write('run_id='+str(r['run_id'])+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.resume.outputs.run_id != ''
        with:
          name: cinematic-comparison
          path: cinema-resume
          run-id: ${{ steps.resume.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Generate and render from topic without authored script
        env:
          GH_TOKEN: ${{ github.token }}
          CE_SHARED_SERVICES: '1'
          CE_JOB_KIND: short
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CE_MAX_REQUESTS: '12'
          CE_MAX_SECONDS: '480'
          CE_METRICS_PATH: cinema-metrics.json
          CE_CINEMA_RESUME_DIR: cinema-resume/cinema-output
        run: python -m studio_lib.recovery run --kind short -- python -m studio_lib.cinema.build --topic-file publish/cinema.topic --out cinema-output
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ce-cache/cinema-voice
          key: cinema-voice-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cinema-output/plan.json
            cinema-output/topic-brief.json
            cinema-output/narration-critique.json
          key: cinema-plan-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-comparison
          path: |
            cinema-output/*.json
            cinema-output/*.png
            cinema-output/*.ass
            cinema-output/video.mp4
            cinema-output/generated-scene.blend
            cinema-metrics.json
          retention-days: 14
