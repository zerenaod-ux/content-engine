name: Cinematic system comparison (not posted)
on:
  push:
    branches: [studio-cinematic-proof]
    paths: [publish/cinema.trigger]
  workflow_dispatch:
permissions:
  contents: read
  models: read
concurrency:
  group: cinematic-comparison
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pillow edge-tts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq blender xvfb ffmpeg fonts-dejavu-core > /dev/null
      - run: python -m unittest discover -s tests/cinema -v
      - uses: actions/cache/restore@v4
        with:
          path: .ce-cache/cinema-voice
          key: cinema-voice-${{ runner.os }}-${{ github.run_id }}
          restore-keys: cinema-voice-${{ runner.os }}-
      - name: Generate and render from topic without authored script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CE_MAX_REQUESTS: '12'
          CE_MAX_SECONDS: '480'
          CE_METRICS_PATH: cinema-metrics.json
        run: python -m studio_lib.cinema.build --topic "Why a direct-drive wind turbine needs no gearbox" --out cinema-output
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ce-cache/cinema-voice
          key: cinema-voice-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-comparison
          path: |
            cinema-output/*.json
            cinema-output/*.png
            cinema-output/*.ass
            cinema-output/video.mp4
            cinema-output/generated-scene.blend
            cinema-metrics.json
          retention-days: 14
