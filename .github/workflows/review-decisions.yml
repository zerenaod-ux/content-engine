name: content-engine-review-folders
on:
  issues:
    types: [labeled]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/review-decisions.yml, review_lib/**]
permissions:
  contents: write
  issues: write
concurrency:
  group: content-engine-review-folders
  cancel-in-progress: false
jobs:
  file-decisions:
    if: github.event_name != 'issues' || github.event.label.name == 'ce-approve' || github.event.label.name == 'ce-skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 review_lib/process.py
        env:
          GH_TOKEN: ${{ github.token }}
