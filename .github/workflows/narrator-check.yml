name: Verify fixed How It Ticks narrator
on:
  push:
    branches: [main]
    paths: [.github/workflows/narrator-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy kokoro-onnx==0.6.1
      - run: python -m tools.narrator_check
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-narrator-preview
          path: narrator-check/
          retention-days: 14
