name: Verify fixed How It Ticks narrator
on:
  push:
    branches: [main]
    paths: [.github/workflows/narrator-check.yml]
  workflow_dispatch:
    inputs:
      voice_options:
        description: Generate three audio-only alternatives instead of the fixed narrator check
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy kokoro-onnx==0.6.1 imageio-ffmpeg
      - if: inputs.voice_options != true
        run: python -m tools.narrator_check
      - if: inputs.voice_options == true
        run: python -m tools.voice_auditions
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.voice_options && 'voice-options' || 'fixed-narrator-preview' }}
          path: |
            narrator-check/
            voice-options/
          retention-days: 14
