name: offline-regression-checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CE_MAX_REQUESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pillow imageio-ffmpeg
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scene_lib/*.py llm.py
      - run: node --check scene_lib/render.js
