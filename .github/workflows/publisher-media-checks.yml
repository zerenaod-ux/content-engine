name: Verify publisher media recovery
on:
  push:
    paths: ['ce_publisher.py', 'tests/publisher/**', '.github/workflows/publisher-media-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/publisher -v
