name: Machine writer
on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Machine idea (empty = pick automatically)'
        required: false
  schedule:
    - cron: '40 8 * * *'
permissions:
  contents: write
concurrency:
  group: ce-machine-writer
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pillow edge-tts pytest
      - run: python -m pytest tests/studio/check_machine_writer.py -q
      - name: Design, check, and save one new machine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACHINE_IDEA: ${{ github.event.inputs.idea }}
          CE_VISION_CHECK: 'off'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CE_SHARED_SERVICES: '1'
          GH_TOKEN: ${{ github.token }}
          CE_MAX_REQUESTS: '120'
          CE_MAX_SECONDS: '3900'
        run: python -m studio_lib.machine_writer
      - name: Commit the new machine spec
        run: |
          if [ -n "$(git status --porcelain machines)" ]; then
            git config user.name "how-it-ticks-bot"; git config user.email "bot@users.noreply.github.com"
            git add machines/mw_*.json
            git commit -m "New machine written and checked by the machine writer"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
          else echo "Nothing new to commit"; fi
