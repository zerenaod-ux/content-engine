name: Verify shared How It Ticks production rules
on:
  push:
    branches: [main]
    paths: [studio_lib/**, scene_lib/**, tests/**, .github/workflows/ce-long.yml, .github/workflows/how-it-ticks-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: how-it-ticks-code-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pillow edge-tts imageio-ffmpeg
      - name: Use installed media tools before fetching dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            pip install --quiet static-ffmpeg==3.0
            mkdir -p "$RUNNER_TEMP/verified-media-tools"
            timeout 180 python -c "from static_ffmpeg import run; run.get_or_fetch_platform_executables_else_raise()"
            python - <<'PY'
          import os,shutil
          from pathlib import Path
          from static_ffmpeg import run
          ffmpeg,ffprobe=run.get_or_fetch_platform_executables_else_raise()
          destination=Path(os.environ['RUNNER_TEMP'])/'verified-media-tools'
          for name,source in [('ffmpeg',ffmpeg),('ffprobe',ffprobe)]:
              shutil.copyfile(source,destination/name)
              (destination/name).chmod(0o755)
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(destination)+'\n')
          PY
            export PATH="$RUNNER_TEMP/verified-media-tools:$PATH"
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: python -m unittest discover -s tests/longform -v
      - run: python -m unittest discover -s tests/cinema -v
      - run: python -m unittest discover -s tests/recovery -v
      - run: python -m unittest discover -s tests/studio -v

      - name: Audit permanent originality policy without generating media
        run: python -m studio_lib.novelty --audit
